<script>
  (function() {
    var theme = localStorage.getItem('theme') || 'dark'; // neon is dark
    if (theme === 'light') {
      // Swap main.css for light.css before it renders to avoid FOUC
      var links = document.getElementsByTagName('link');
      for (var i = 0; i < links.length; i++) {
        if (links[i].href.indexOf('main.css') > -1) {
          links[i].href = links[i].href.replace('main.css', 'light.css');
        }
      }
    }
    
    document.addEventListener("DOMContentLoaded", function() {
        var toggleBtn = document.createElement("button");
        toggleBtn.innerHTML = theme === 'dark' ? '☀️' : '🌙';
        toggleBtn.id = "theme-toggle";
        toggleBtn.title = "Toggle Light/Dark Mode";
        toggleBtn.style.cssText = "position: fixed; bottom: 20px; right: 20px; z-index: 9999; padding: 10px; border-radius: 50%; border: none; background: #333; color: #fff; cursor: pointer; font-size: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;";
        if(theme === 'light') {
            toggleBtn.style.background = '#eee';
            toggleBtn.style.color = '#000';
        }
        
        document.body.appendChild(toggleBtn);

        toggleBtn.addEventListener('click', function() {
            var currentTheme = localStorage.getItem('theme') || 'dark';
            var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            
            var links = document.getElementsByTagName('link');
            for (var i = 0; i < links.length; i++) {
              var targetHref = currentTheme === 'dark' ? 'main.css' : 'light.css';
              var replacement = newTheme === 'dark' ? 'main.css' : 'light.css';
              if (links[i].href.indexOf(targetHref) > -1) {
                links[i].href = links[i].href.replace(targetHref, replacement);
              }
            }
            toggleBtn.innerHTML = newTheme === 'dark' ? '☀️' : '🌙';
            toggleBtn.style.background = newTheme === 'dark' ? '#333' : '#eee';
            toggleBtn.style.color = newTheme === 'dark' ? '#fff' : '#000';
        });
    });
  })();
</script>
<!-- end custom head snippets -->
